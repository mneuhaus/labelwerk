[workspace]
resolver = "2"
members = ["crates/labelwerk-core", "crates/labelwerk-cli", "crates/labelwerk-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
labelwerk-core = { path = "crates/labelwerk-core" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
